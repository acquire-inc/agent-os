name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Ephemeral CI vault key (not a real secret).
      AOS_VAULT_KEY: ${{ secrets.AOS_VAULT_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate a vault key if not provided
        run: |
          if [ -z "${AOS_VAULT_KEY}" ]; then
            echo "AOS_VAULT_KEY=$(node -e 'console.log(require(\"crypto\").randomBytes(32).toString(\"base64\"))')" >> "$GITHUB_ENV"
          fi

      - name: Verify (migrate, seed, typecheck, test suites, build)
        run: pnpm verify
