name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  launch-check:
    # Fast offline gate — no DB service. Runs on every push, ~30s.
    # `pnpm launch:check` runs 17 offline test suites + workspace typecheck +
    # migration ordering + relay registry hygiene + cant-fail key pin +
    # doctrine-docs presence. Greenlights internal launch when all 22 checks
    # pass. See docs/internal-launch-runbook.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Launch readiness check (offline)
        run: pnpm launch:check

  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Ephemeral CI vault key (not a real secret).
      AOS_VAULT_KEY: ${{ secrets.AOS_VAULT_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json's `packageManager: pnpm@x.y.z`.
        # Specifying it both here and there triggers ERR_PNPM_BAD_PM_VERSION.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate a vault key if not provided
        run: |
          if [ -z "${AOS_VAULT_KEY}" ]; then
            echo "AOS_VAULT_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          fi

      - name: Verify (migrate, seed, typecheck, test suites, build)
        run: pnpm verify
